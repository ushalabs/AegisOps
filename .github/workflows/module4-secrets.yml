name: Module 4 - Variables and Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Variables and Secrets
        env:
          LAB_VAR: ${{ vars.LAB_MESSAGE }}
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: |
          echo "Variable: $LAB_VAR"

          if [ -n "$MY_SECRET" ]; then
            echo "Secret exists and is protected"
          else
            echo "Secret is missing"
            exit 1
          fi

      - name: Test GITHUB_TOKEN REST API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}" \
            --jq '.full_name'

      - name: Test Authenticated Git Operation
        run: |
          git ls-remote origin HEAD