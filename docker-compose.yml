services:
  db:
    image: pgvector/pgvector:pg16
    container_name: aegisops-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  benchmark-db:
    image: postgres:16
    container_name: aegisops-benchmark-db

    environment:
      POSTGRES_DB: ${BENCHMARK_POSTGRES_DB}
      POSTGRES_USER: ${BENCHMARK_POSTGRES_USER}
      POSTGRES_PASSWORD: ${BENCHMARK_POSTGRES_PASSWORD}

    volumes:
      - benchmark_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${BENCHMARK_POSTGRES_USER} -d ${BENCHMARK_POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  benchmark-redis:
    image: redis:7-alpine
    container_name: aegisops-benchmark-redis

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  benchmark-api:
    build:
      context: ./benchmark

    container_name: aegisops-benchmark-api

    environment:
      BENCHMARK_DB_HOST: benchmark-db
      BENCHMARK_DB_PORT: 5432
      BENCHMARK_DB_NAME: ${BENCHMARK_POSTGRES_DB}
      BENCHMARK_DB_USER: ${BENCHMARK_POSTGRES_USER}
      BENCHMARK_DB_PASSWORD: ${BENCHMARK_POSTGRES_PASSWORD}

      BENCHMARK_REDIS_HOST: benchmark-redis
      BENCHMARK_REDIS_PORT: 6379

    ports:
      - "8001:8000"

    depends_on:
      benchmark-db:
        condition: service_healthy
      benchmark-redis:
        condition: service_healthy

    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: aegisops-prometheus

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    ports:
      - "9090:9090"

    depends_on:
      - benchmark-api

    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: aegisops-cadvisor

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

    ports:
      - "8080:8080"

    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: aegisops-grafana

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

    depends_on:
      - prometheus

    restart: unless-stopped

volumes:
  postgres_data:
  benchmark_postgres_data:
  grafana_data: